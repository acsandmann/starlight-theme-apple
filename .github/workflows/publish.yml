name: Publish package

on:
  push:
    paths:
      - packages/starlight-theme-apple/package.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  create_tag:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag
        id: version
        env:
          PACKAGE_FILE: packages/starlight-theme-apple/package.json
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current_version=$(node -p "require('./$PACKAGE_FILE').version")
          previous_version=$(git show "$BEFORE_SHA:$PACKAGE_FILE" | node -e "let input = ''; process.stdin.on('data', chunk => input += chunk).on('end', () => console.log(JSON.parse(input).version))")

          if [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Package version was not changed; no tag will be created."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          tag="v$current_version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

  publish:
    needs: create_tag
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.ref_type == 'tag' ||
        (github.ref_type == 'branch' && needs.create_tag.outputs.version_changed == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install

      - name: Publish to npm
        run: npm publish --access public --workspace starlight-theme-apple
